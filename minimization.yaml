# Prepare inputs for an existing assembled system:
# gmxtransplant prepare-minimization -i minimization.yaml
# Prepare portable OpenMM inputs. Run the generated script separately.
minimization:
  coordinates_path: step5_input.gro
  topology_path: topol.top
  output_dir: openmm_minimization
  restraint_force_constant_kj_mol_nm2: 1000.0
  # Unknown molecules are treated as ligands. Classify custom lipids here.
# Optional restraint_residue_classes: {MYLIP: lipid} classifies custom lipids.
  tolerance_kj_mol_nm: 10.0  # RMS minimizer objective gradient.
  max_iterations: 5000
  # Review nonbonded settings for your force field.
  nonbonded_method: PME
  nonbonded_cutoff_nm: 1.2
  switch_distance_nm: 1.0  # OpenMM potential switching.
  constraints: h_bonds
  rigid_water: true
  ewald_error_tolerance: 5.0e-4
  use_dispersion_correction: false
  platform: CPU
# Topology position_restraints must be inactive.
  resources:
    cpus_per_task: 8
    time: "00:30:00"
    memory: 8G
