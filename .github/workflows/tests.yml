name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test tools
        run: python -m pip install --upgrade pip build .
      - name: Run tests
        run: python -m unittest discover -v
      - name: Build source and wheel distributions
        run: python -m build

  minimization-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package with OpenMM
        run: python -m pip install --upgrade pip '.[minimize]'
      - name: Run minimization smoke test
        run: python -m unittest -v test_minimization test_minimization_bundle test_minimization_restraints
