# Restore experimentally resolved cholesterol into an equilibrated membrane
# Run: gmxtransplant --mode chl -i cholesterol_restore.yaml
#
# EDITING GUIDE
# 1. Edit paths only in this first block. ${name} references reuse them below.
# 2. Edit receptor masks, cholesterol names, and target composition below.
# 3. Run with --dry-run before processing coordinates (checks configuration and
#    paths, not a full geometric trial). Inspect the assembled reports afterward.
# Paths below are placeholders. Relative paths resolve from the working directory.
# ${name} reuses a value from paths; no YAML anchors are needed.
# Distances are Å unless explicitly marked nm; charges are elementary charges e.
# Numeric settings are examples to review for your system, not universal defaults.

# -----------------------------------------------------------------------------
# 1. PATHS: normally the only block that changes when moving to a new system
# -----------------------------------------------------------------------------
paths:
  experimental_coordinates: inputs/experimental/receptor_cholesterol.pdb
  environment_coordinates: inputs/environment/equilibrated.gro
  composition_reference_coordinates: inputs/environment/equilibrated.gro
  receptor_toppar: inputs/environment/toppar
  receptor_topology: inputs/environment/topol.top
  environment_toppar: inputs/environment/toppar
  topology_output_dir: .
  final_pdb: step5_input.pdb
  final_gro: step5_input.gro
  report_prefix: cholesterol_restoration_report
  inspection_pdb: aligned_cholesterol_inspection.pdb
  index: index.ndx
  reference_gro: null
  diagnostic_raw_pdb: cholesterol_protonated_raw.pdb
  diagnostic_converted_pdb: cholesterol_charmm36.pdb
  diagnostic_aligned_reference_pdb: cholesterol_reference_aligned.pdb
  diagnostic_placed_reference_pdb: cholesterol_reference_placed.pdb
  diagnostic_merged_pdb: merged_system.pdb
  minimized_gro: minimized.gro
  minimization_report: minimization_report

# -----------------------------------------------------------------------------
# 2. STRUCTURES, CHOLESTEROL CONVERSION, AND COMPOSITION
# -----------------------------------------------------------------------------
cholesterol:
  # Experimental receptor/cholesterol source. The receptor provides only the
  # alignment transform; the target receptor itself is retained.
  experimental_structure_path: "${experimental_coordinates}"

  # Complete equilibrated receptor/membrane/solvent/ion environment.
  # Prefer GRO with full lipid names. Cholesterol mode does not run receptor-
  # mode name_restoration; ambiguous PDB names must be resolved beforehand.
  target_system_path: "${environment_coordinates}"
  target_system_format: auto  # Alternatives: pdb or gro.
  # null reads the stored cell. For PDB without CRYST1 supply the MATCHING
  # cell: [a, b, c, alpha, beta, gamma] in Å/degrees (GRO lengths are in nm).
  box_dimensions: null

  # Masks use 1-based sequential residue positions, NOT file residue IDs.
  # 1-328 is a placeholder for the corresponding protein in each structure.
  # Exclude cholesterol from receptor masks: only protein defines placement.
  # Include corresponding G-protein residues if desired; edit both fit masks too.
  target_receptor_mask: ":1-328"
  experimental_receptor_mask: ":1-328"
  cholesterol_resnames: [CHL1, CHL, CHOL, CLR]
  charmm_resname: CHL1

  convert_to_charmm36: true  # Alternative: false for already compatible CHL1.
  reconstruct_missing_heavy_atoms: true  # Alternative: false to reject any gap.
  max_missing_heavy_atoms: 2  # Maximum absent heavy atoms allowed for rebuilding.
  max_heavy_atom_fit_rmsd: 1.5  # Å, maximum reference-fit RMSD for rebuilding.
  write_diagnostics: false  # Alternative: true retains all files named below.
  # Empty uses the embedded 74-atom reference; alternative: a reference PDB path.
  charmm36_reference_path: ""
  obabel_command: obabel
  verify_tolerance: 0.40  # Å, heavy-atom position verification tolerance.
  raw_protonated_pdb_path: "${diagnostic_raw_pdb}"
  converted_pdb_path: "${diagnostic_converted_pdb}"
  aligned_reference_pdb_path: "${diagnostic_aligned_reference_pdb}"
  reference_placed_pdb_path: "${diagnostic_placed_reference_pdb}"
  merged_pdb_path: "${diagnostic_merged_pdb}"

  composition:
    # Salt baseline and desired leaflet counts. Missing lipids are reported but
    # not added; surplus molecules farther than distance_from_protein can be removed.
    reference_system_path: "${composition_reference_coordinates}"
    distance_from_protein: 20.0
    target_concentration: 0.15  # mol/L; edit for the desired salt concentration.
    concentration_tolerance_fraction: 0.05  # Relative tolerance (5%).
    salt_cation: SOD
    salt_anion: CLA
    random_seed: 42
    # Example counts, not universal membrane composition; edit each leaflet.
    lipid_targets:
      CHL1: {upper: 40, lower: 40}
      POPE: {upper: 60, lower: 59}
      POPC: {upper: 100, lower: 98}

# -----------------------------------------------------------------------------
# 3. ALIGNMENT
# -----------------------------------------------------------------------------
# These fit masks select corresponding protein CA atoms, not cholesterol.
# mask_fit uses equal-size selections paired in file order without outlier
# rejection. Alternative @C,CA,N,O fits backbone; smaller stable regions work.
# The resulting transform moves experimental cholesterol into the target frame.
alignment:
  method: mask_fit  # Alternatives: pymol_align or pymol_cealign (need PyMOL).
  region_mask_original: ":1-328@CA"
  region_mask_replacement: ":1-328@CA"
  cycles: 5  # Used by pymol_align; retained for easy method switching.
  cutoff: 2.0

# -----------------------------------------------------------------------------
# 4. ENVIRONMENT AND CLASH SAFETY
# -----------------------------------------------------------------------------
# Preflight checks the input environment against its periodic cell before insertion.
# strict rejects invalid periodic geometry; repair searches for one global rigid
# rotation/translation that passes clash checks without changing the cell. off
# skips checks. Repair is not a cure for incorrect box lengths or overlapping atoms.
box_validation:
  mode: strict  # Alternatives: repair or off.
  hard_clash_cutoff: 1.2  # Å, nonbonded pairs.
  molecule_protrusion_allowance: 5.0  # Å, diagnostic only.
  search_sample_size: 20000  # Atoms sampled for the orientation search.
  random_seed: 42
  wrap_after_validation: false  # true images whole connected molecules.
  # Optional repair search budgets; raising them may help but costs runtime.
  # search_starts: 12
  # search_max_iterations: 150
  # max_candidate_verifications: 12
  # max_search_seconds: 45.0

# Class cutoffs override threshold (the fallback). A clash removes a complete
# eligible residue, not just an atom. keep_classes preserves listed classes and
# reports contacts: retained contacts may still need attention before simulation.
# Valid classes: protein, lipid, water, ion, other; mode protections also apply.
clash_detection:
  # Complete lipid/water/ion residues within 3 Å of inserted cholesterol are
  # removed. Protein and other solutes are protected by cholesterol mode.
  threshold: 3.0
  thresholds:
    lipid: 3.0
    water: 3.0
    ion: 3.0
    other: 3.0
  use_pbc: true  # false requires box_validation.mode: off.
  heavy_atoms_only: false  # Alternative: true to test only heavy atoms.
  flag_lipid_removal_fraction: 0.05  # Flag removal above 5%; not a removal cap.
  keep_classes: []

# -----------------------------------------------------------------------------
# 5. GROMACS AND OUTPUTS
# -----------------------------------------------------------------------------
# Receptor ITPs/template define protein molecules and their order. Environment
# ITPs define retained lipids/water/ions. They may share a directory/topology when
# derived from the same compatible system. Use consistent force-field parameters.
# Output molecule counts are rebuilt from the assembled coordinates.
topology:
  enabled: true  # Alternative: false writes coordinates/reports without topology.
  receptor_toppar_dir: "${receptor_toppar}"
  receptor_template_top: "${receptor_topology}"
  environment_toppar_dir: "${environment_toppar}"
  ligand_itp_paths: []
  moleculetype_overrides: {}  # Example: {LIG1: LigandType}; resname -> ITP type.
  output_dir: "${topology_output_dir}"

# generic writes descriptive groups (Protein, Ligand, etc.); charmm_gui writes
# SOLU/MEMB/SOLV-style groups; both writes both naming conventions.
ndx:
  enabled: true
  output_path: "${index}"
  style: charmm_gui  # Alternatives: generic or both.
  extra_groups: {}  # Example: {Backbone: ":1-100@C,CA,N,O"}; edit indices.

refgro: "${reference_gro}"  # null disables the optional comparison.

output:
  pdb_path: "${final_pdb}"
  gro_path: "${final_gro}"
  report_path: "${report_prefix}"  # Prefix for .txt and .json reports.
  inspection_pdb_path: "${inspection_pdb}"

# -----------------------------------------------------------------------------
# 6. OPTIONAL OPENMM ENERGY MINIMIZATION
# -----------------------------------------------------------------------------
# Set enabled: true or add --minimize to the run command. The freshly generated
# final_gro and topology_output_dir/topol.top are always used after assembly.
# Requires OpenMM and topology.enabled: true. These settings control forces like
# an MDP would; no MDP is read. Review them against your force field/protocol.
# Minimization relaxes coordinates; it does not replace equilibration.
minimization:
  enabled: false  # Alternative: true runs minimization after assembly.
  coordinates_path: ""  # Standalone-only; ignored after an assembly mode.
  topology_path: ""  # Standalone-only; ignored after an assembly mode.
  include_dir: ""  # Empty uses the directory containing topol.top.
  output_gro_path: "${minimized_gro}"
  report_path: "${minimization_report}"
  algorithm: lbfgs  # Only supported algorithm (OpenMM constrained minimizer).
  tolerance_kj_mol_nm: 10.0  # RMS objective-gradient tolerance; smaller is tighter.
  max_iterations: 5000  # Alternative: 0 continues until convergence.
  constraint_tolerance: 1.0e-5  # Relative constraint error, between 0 and 1.
  nonbonded_method: PME  # Periodic alternatives: LJPME, Ewald, CutoffPeriodic.
  # Also accepted: CutoffNonPeriodic or NoCutoff, for deliberately nonperiodic
  # calculations; these do not represent the usual periodic membrane system.
  nonbonded_cutoff_nm: 1.2  # nm, not Å; must fit the periodic cell.
  switch_distance_nm: 1.0  # nm, below cutoff; null or 0 disables LJ switching.
  constraints: h_bonds  # Alternatives: none, all_bonds, h_angles.
  rigid_water: true  # false allows flexibility unless topology constrains it.
  ewald_error_tolerance: 5.0e-4  # PME/Ewald accuracy; smaller is more expensive.
  use_dispersion_correction: false  # Alternative: true.
  # auto tries CUDA, HIP, OpenCL, CPU, then Reference among installed platforms.
  platform: auto  # Explicit alternative: CUDA, HIP, OpenCL, CPU, Reference.
  precision: mixed  # Alternatives: single or double.
  device_index: ""  # Example: "0".
  # Preprocessor symbols, only effective if the topology contains matching guards.
  # Parser support for active directives still applies; this is not an MDP.
  defines: {}  # Example: {CUSTOM_PARAMETER_SET: 1}.
