# Replace one ligand while retaining an equilibrated protein/membrane system
# Run: gmxtransplant --mode lig -i ligand_replace.yaml
#
# EDITING GUIDE
# 1. Edit paths only in this first block. ${name} references reuse them below.
# 2. Edit ligand names and fit settings in the next block.
# 3. Run with --dry-run before processing coordinates (checks configuration and
#    paths, not a full geometric trial). Inspect the assembled reports afterward.
# Paths below are placeholders. Relative paths resolve from the working directory.
# ${name} reuses a value from paths; no YAML anchors are needed.
# Distances are Å unless explicitly marked nm; charges are elementary charges e.
# Numeric settings are examples to review for your system, not universal defaults.

# -----------------------------------------------------------------------------
# 1. PATHS: normally the only block that changes when moving to a new system
# -----------------------------------------------------------------------------
paths:
  environment_coordinates: inputs/environment/equilibrated.gro
  new_ligand_coordinates: inputs/ligand/LIG1.mol2
  new_ligand_itp: inputs/ligand/LIG1.itp
  protein_toppar: inputs/environment/toppar
  protein_topology: inputs/environment/topol.top
  environment_toppar: inputs/environment/toppar
  topology_output_dir: .
  final_pdb: step5_input.pdb
  final_gro: step5_input.gro
  report_prefix: ligand_replacement_report
  inspection_pdb: aligned_ligand_inspection.pdb
  index: index.ndx
  reference_gro: null

# -----------------------------------------------------------------------------
# 2. SYSTEM, LIGANDS, AND PLACEMENT
# -----------------------------------------------------------------------------
ligand_replace:
  # Complete protein + membrane + solvent + ions + old ligand system.
  # Prefer GRO to retain full residue names and the simulation box. Ligand
  # mode does not run protein-mode name_restoration; supply correct names.
  structure_path: "${environment_coordinates}"
  format: auto  # Alternatives for the environment: gro or pdb.
  # null uses the stored box. Alternative: [a,b,c,alpha,beta,gamma] in Å/degrees.
  box_dimensions: null

  # LIG1 means ligand 1; replace with the actual old/new names independently.
  original_ligand:
    # Use LIG1:N (for example LIG1:2) if multiple LIG1 residues exist.
    resname: LIG1

  new_ligand:
    coord_path: "${new_ligand_coordinates}"
    format: auto  # Or any MDAnalysis-supported explicit format, e.g. mol2.
    resname: LIG1
    # Coordinates must have the ITP atom names/count; parameters are not generated.
    itp_path: "${new_ligand_itp}"

  fit:
    # Active: autofit matches all uniquely named heavy atoms by exact name.
    # Alternative: pairfit uses the two ordered lists below (>=3 non-collinear).
    # Alternative: nofit keeps an already positioned ligand exactly as supplied.
    method: autofit
    # old_ligand_fit_atoms: [C1, C2, N1]
    # new_ligand_fit_atoms: [C1, C2, N1]

# -----------------------------------------------------------------------------
# 3. ENVIRONMENT AND CLASH SAFETY
# -----------------------------------------------------------------------------
# Preflight checks the input environment against its periodic cell before insertion.
# strict rejects invalid periodic geometry; repair searches for one global rigid
# rotation/translation that passes clash checks without changing the cell. off
# skips checks. Repair is not a cure for incorrect box lengths or overlapping atoms.
box_validation:
  mode: strict  # Alternatives: repair or off.
  hard_clash_cutoff: 1.2  # Å, nonbonded pairs.
  molecule_protrusion_allowance: 5.0  # Å, diagnostic only.
  search_sample_size: 20000  # Atoms sampled for the orientation search.
  random_seed: 42
  wrap_after_validation: false  # true images whole connected molecules.
  # Optional repair search budgets; raising them may help but costs runtime.
  # search_starts: 12
  # search_max_iterations: 150
  # max_candidate_verifications: 12
  # max_search_seconds: 45.0

# Class cutoffs override threshold (the fallback). A clash removes a complete
# eligible residue, not just an atom. keep_classes preserves listed classes and
# reports contacts: retained contacts may still need attention before simulation.
# Valid classes: protein, lipid, water, ion, other; mode protections also apply.
clash_detection:
  threshold: 0.80
  thresholds:
    protein: 0.80
    lipid: 0.80
    water: 0.80
    ion: 0.80
    other: 0.80
  use_pbc: true  # false requires box_validation.mode: off.
  heavy_atoms_only: true  # Alternative: false includes hydrogen atoms.
  flag_lipid_removal_fraction: 0.05  # Flag removal above 5%; not a removal cap.
  keep_classes: []  # Protein is always protected automatically in ligand mode.

# -----------------------------------------------------------------------------
# 4. CHARGE CORRECTION
# -----------------------------------------------------------------------------
# Neutralization removes existing counterions; it does not add ions or set salt
# concentration. ITP charges take precedence over generic residue charge guesses.
charge:
  target_net_charge: 0.0
  neutralize: true  # Alternative: false reports charge without removing ions.
  tolerance: 0.01  # e; acceptable deviation from target net charge.
  exclusion_distance_from_protein: 10.0  # Å; protect nearby ions from removal.
  exclusion_distance_from_ligand: 10.0
  exclusion_distance_from_lipid: 5.0
  # true protects ions near lipid heavy atoms using the PBC distance above;
  # it does NOT use an absolute-z membrane slab. false disables lipid protection.
  exclude_membrane_interior: true
  random_seed: 42
  charge_table_overrides: {}  # Example: {LIG1: 1.0}; use actual species charges.

# -----------------------------------------------------------------------------
# 5. GROMACS AND OUTPUTS
# -----------------------------------------------------------------------------
# Protein ITPs/template define protein molecules and their order. Environment
# ITPs define retained lipids/water/ions. They may share a directory/topology when
# derived from the same compatible system. Use consistent force-field parameters.
# Output molecule counts are rebuilt from the assembled coordinates.
topology:
  enabled: true  # Alternative: false writes coordinates/reports without topology.
  protein_toppar_dir: "${protein_toppar}"
  protein_template_top: "${protein_topology}"
  environment_toppar_dir: "${environment_toppar}"
  # new_ligand.itp_path is included automatically. List only extra cofactors.
  ligand_itp_paths: []
  moleculetype_overrides: {}  # Example: {LIG1: LigandType}; resname -> ITP type.
  output_dir: "${topology_output_dir}"

# generic writes descriptive groups (Protein, Ligand, etc.); charmm_gui writes
# SOLU/MEMB/SOLV-style groups; both writes both naming conventions.
ndx:
  enabled: true
  output_path: "${index}"
  style: both  # Alternatives: generic or charmm_gui.
  extra_groups: {}  # Example: {Backbone: ":1-100@C,CA,N,O"}; edit indices.

refgro: "${reference_gro}"  # null disables the optional comparison.

output:
  pdb_path: "${final_pdb}"
  gro_path: "${final_gro}"
  report_path: "${report_prefix}"  # Prefix for .txt and .json reports.
  inspection_pdb_path: "${inspection_pdb}"

# Prepare portable OpenMM inputs. Run the generated script separately.
minimization:
  enabled: false  # Or add --prepare-minimization to the assembly command.
  output_dir: openmm_minimization
  restraint_force_constant_kj_mol_nm2: 1000.0
  # Unknown molecules are treated as ligands. Classify custom lipids here.
  restraint_residue_classes: {}  # Example: {MYLIP: lipid}
  tolerance_kj_mol_nm: 10.0  # RMS minimizer objective gradient.
  max_iterations: 5000
  # Review nonbonded settings for your force field.
  nonbonded_method: PME
  nonbonded_cutoff_nm: 1.2
  switch_distance_nm: 1.0  # OpenMM potential switching.
  constraints: h_bonds
  rigid_water: true
  ewald_error_tolerance: 5.0e-4
  use_dispersion_correction: false
  platform: CPU
  defines: {}  # Topology position_restraints must be inactive.
  resources:
    cpus_per_task: 8
    time: "00:30:00"
    memory: 8G
