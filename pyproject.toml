[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GMXtransplant"
version = "0.2.0"
description = "Insert receptor-ligand systems or experimental cholesterol into prepared GROMACS membrane environments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "PyYAML>=6.0",
  "MDAnalysis>=2.4",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
minimize = ["openmm>=8.2"]
dev = ["build>=1.2"]

[project.scripts]
gmxtransplant = "run_pipeline:cli"
gmxtransplant-cholesterol = "charmm36_cholesterol:main"

[tool.setuptools]
packages = ["gmxtransplant"]
py-modules = [
  "align",
  "box_validation",
  "chainids",
  "charges",
  "charmm36_cholesterol",
  "cholesterol",
  "cholesterol_report",
  "clash_logic",
  "clashes",
  "classify",
  "config",
  "ion_selection",
  "itp",
  "kabsch",
  "ligand_replace",
  "masks",
  "minimization",
  "namefix",
  "ndx",
  "output",
  "replace",
  "replacement_ligands",
  "report",
  "run_pipeline",
  "topology",
]

[tool.setuptools.data-files]
"share/gmxtransplant/examples" = [
  "receptor_replace.yaml",
  "ligand_replace.yaml",
  "cholesterol_restore.yaml",
  "minimization.yaml",
]
