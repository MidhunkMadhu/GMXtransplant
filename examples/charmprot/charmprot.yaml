# Only these two folders are required. Each contains topol.top, toppar/ and step5_input.gro.
# Default: replace reference proteins and ligands; retain its membrane, water and ions.
charmprot:
  reference: reference
  transplant: transplant
  # auto: reference proteins and ligands are removed; transplant proteins and
  #   ligands are inserted.
  # ignore: reference proteins and ligands are removed; only transplant proteins
  #   are inserted (its ligands are left out).
  ligands: auto
# Other optional settings (keep_lipids, clash_distance, ...) also belong under charmprot.
