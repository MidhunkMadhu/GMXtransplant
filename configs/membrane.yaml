# Replace the membrane of a prepared system with any equilibrated bilayer: mixed
# lipids, cholesterol, asymmetric leaflets. The protein and ligands keep their
# coordinates (the OPM placement); every host lipid and sterol is replaced by
# the reference lipids, repeated and cut to the host box on the host midplane.
membrane:
  host: /path/to/membrane_system        # folder with topol.top, toppar/ and step5_input.gro
  reference_gro: /path/to/bilayer.gro   # equilibrated bilayer (lipids, sterols, optional water), CHARMM36 names
  resname_map: {}                       # e.g. {CLOL: CHL1}: reference residue name -> moleculetype
  lipid_itps: []                        # ITPs of reference lipids the host does not have (e.g. POPS.itp)
  # lipid_forcefield: /path/to/forcefield.itp   # parameters for lipid_itps the host lacks
  # membrane_center_z: 123.0            # A, host GRO frame; default: midway between the host's P planes
  protein_clash_distance: 3.0  # A; reference lipids closer to protein/ligand heavy atoms are removed
  water_layer: 10.0            # A beyond each P plane hydrated by the reference water (0: host water only)
  restore_salt: true           # add salt pairs in the bulk water back to the host concentration
  equilibration:
    enabled: true              # write equilibration/: GROMACS CHARMM-GUI step6 schedule + sample_run.sh
    temperature: 310.0
# Replace each /path/to/ placeholder with a full path; none is resolved against the
# working directory. Generated files use the --output folder, or the directory you
# run the command from. Optional: host_gro, max_tilt, anchor_count, anchor_separation,
# lateral_search, protein_hydration_distance, reference_contact_distance,
# water_clash_distance, neutralize, target_net_charge, ion_exclusion_distance,
# lipid_ion_exclusion_distance, environment_overrides, output_dir,
# equilibration.output_dir, equilibration.stages.
